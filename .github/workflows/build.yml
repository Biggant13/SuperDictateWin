name: Build & Release

on:
  push:
    tags:
      - 'v*'                 # запуск при пуше тега вида v1.0.0
  workflow_dispatch:         # возможность запустить вручную из вкладки Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SuperDictate-Windows
            asset_name: SuperDictate-Windows.zip
          - os: ubuntu-22.04      # НЕ ubuntu-latest (для совместимости glibc)
            artifact_name: SuperDictate-Linux
            asset_name: SuperDictate-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5   # Обновлено до Node.js 24

      - name: Set up Python
        uses: actions/setup-python@v6   # Обновлено до Node.js 24
        with:
          python-version: '3.12'
          cache: 'pip'

      # ---------- Системные зависимости (только Linux) ----------
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-cursor0 \
            xclip \
            libayatana-appindicator3-1 \
            gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev \
            python3-tk \
            binutils

      # ---------- Python-зависимости ----------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # ---------- Сборка ----------
      - name: Build with PyInstaller
        run: pyinstaller SuperDictate.spec --clean --noconfirm

      # ---------- Упаковка артефакта ----------
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell Compress-Archive -Path dist\SuperDictate\* -DestinationPath ${{ matrix.asset_name }}

      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf ../${{ matrix.asset_name }} SuperDictate/

      # ---------- Загрузка артефакта ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v6   # Обновлено до Node.js 24
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  # ---------- Публикация Release ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7   # Обновлено до Node.js 24
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true