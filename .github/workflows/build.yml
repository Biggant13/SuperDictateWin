name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: SuperDictate-Windows
            asset_name: SuperDictate-Windows.zip
          - os: ubuntu-22.04
            artifact_name: SuperDictate-Linux
            asset_name: SuperDictate-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libxcb-shape0 libxcb-cursor0 xclip \
            libayatana-appindicator3-1 gir1.2-ayatanaappindicator3-0.1 \
            libgirepository1.0-dev python3-tk binutils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Inject version from tag (All OS)
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.5.1"
          fi
          VERSION=${TAG_NAME#v}
          echo "__version__ = \"$VERSION\"" > core/version.py
          echo "Установлена версия: $VERSION"
          
      # ---------- СБОРКА ----------

      - name: Build with PyInstaller
        run: pyinstaller SuperDictate.spec --clean --noconfirm

      # ---------- Упаковка (ZIP для Windows) ----------
      - name: Package ZIP (Windows)
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist\SuperDictate\* -DestinationPath ${{ matrix.asset_name }}

      # ---------- Упаковка (TAR.GZ для Linux) ----------
      - name: Package TAR.GZ (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf ../${{ matrix.asset_name }} SuperDictate/

      # ---------- Создание установщика Inno Setup (Только Windows) ----------
      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y

      # ---------- Очистка старых файлов (Только Windows) ----------
      - name: Clean old installer files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "dist_installer") {
              Remove-Item -Recurse -Force "dist_installer"
          }

      # ---------- Создание установщика Inno Setup (Только Windows) ----------
      - name: Build Installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Читаем файл version.py
          $content = Get-Content core/version.py -Raw
          if ($content -match '__version__\s*=\s*"([^"]+)"') {
              $version = $matches[1]
          } else {
              $version = "0.0.0-unknown"
          }
          
          Write-Host "Сборка установщика с версией: $version"
          
          # Убрали кавычки вокруг $version!
          iscc /DMyAppVersion=$version installer.iss
          
          # Проверяем, какой файл создался
          Get-ChildItem dist_installer

      # ---------- Загрузка артефактов ----------
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}-ZIP
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

      - name: Upload Installer artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: SuperDictate-Windows-Installer
          path: dist_installer/*.exe
          if-no-files-found: error

  # ---------- Публикация Release ----------
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true